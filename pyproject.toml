[project]
name = "wecom-backend"
version = "0.1.0"
description = "WeCom DM sync backend (FastAPI) built on top of wecom-cli"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Conservative default set + import sorting; keep pre-commit fast and low-noise.
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by the formatter, not enforced as a lint error

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection defaults (Depends/Query/...) are idiomatic, not B008 bugs.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
]
