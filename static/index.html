<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WeCom 私聊同步</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --panel2: #232d3a;
      --border: #2e3a48;
      --text: #e7ecf1;
      --muted: #8b9aab;
      --accent: #3d8bfd;
      --mine: #1e4d8c;
      --theirs: #2a3441;
      --danger: #e35d6a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "IBM Plex Sans", "Source Han Sans SC", "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header h1 { font-size: 1rem; margin: 0; font-weight: 600; letter-spacing: 0.02em; }
    header .meta { font-size: 0.75rem; color: var(--muted); }
    header .err { color: var(--danger); font-size: 0.75rem; }
    .app {
      flex: 1;
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 0;
      overflow: hidden;
    }
    .sidebar {
      border-right: 1px solid var(--border);
      background: var(--panel);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .conv {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.12s;
    }
    .conv:hover { background: var(--panel2); }
    .conv.active { background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent); }
    .conv .name { font-size: 0.9rem; font-weight: 500; }
    .conv .preview {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conv .time { font-size: 0.65rem; color: var(--muted); margin-top: 0.2rem; }
    .conv.empty .name { color: var(--muted); }
    .chat {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at top left, #1a2838 0%, transparent 50%),
        var(--bg);
    }
    .chat-head {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
      background: rgba(26, 34, 44, 0.85);
    }
    .chat-head .sub { font-size: 0.7rem; color: var(--muted); font-weight: 400; }
    .msgs {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .bubble-row { display: flex; }
    .bubble-row.mine { justify-content: flex-end; }
    .bubble {
      max-width: min(70%, 480px);
      padding: 0.55rem 0.75rem;
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.45;
      word-break: break-word;
    }
    .bubble.mine { background: var(--mine); border-bottom-right-radius: 3px; }
    .bubble.theirs { background: var(--theirs); border-bottom-left-radius: 3px; }
    .bubble .when { font-size: 0.65rem; color: var(--muted); margin-top: 0.35rem; }
    .bubble img {
      max-width: 100%;
      border-radius: 6px;
      display: block;
    }
    .bubble audio {
      display: block;
      width: min(280px, 100%);
      height: 36px;
      margin-top: 0.15rem;
    }
    .bubble video {
      display: block;
      max-width: min(320px, 100%);
      max-height: 360px;
      border-radius: 6px;
      margin-top: 0.15rem;
      background: #000;
    }
    .bubble a { color: #9ec1ff; }
    .composer {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    .composer input {
      flex: 1;
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      font-size: 0.9rem;
      outline: none;
    }
    .composer input:focus { border-color: var(--accent); }
    .composer button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 1.1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .composer button:disabled { opacity: 0.5; cursor: not-allowed; }
    .empty-state {
      margin: auto;
      color: var(--muted);
      text-align: center;
      font-size: 0.9rem;
    }
    footer {
      flex-shrink: 0;
      padding: 0.4rem 1rem;
      font-size: 0.65rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    @media (max-width: 720px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { max-height: 40vh; }
    }
  </style>
</head>
<body>
  <header>
    <h1>WeCom 私聊</h1>
    <span class="meta" id="syncMeta">同步中…</span>
    <span class="err" id="syncErr"></span>
  </header>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <section class="chat">
      <div class="chat-head" id="chatHead">选择左侧联系人</div>
      <div class="msgs" id="msgs">
        <div class="empty-state">从左侧选择一个私聊对象</div>
      </div>
      <form class="composer" id="composer">
        <input id="input" type="text" placeholder="输入消息…" autocomplete="off" disabled />
        <button type="submit" id="sendBtn" disabled>发送</button>
      </form>
    </section>
  </div>
  <footer>
    后台约每 5 秒轮询 wecom-cli，页面每 3 秒刷新；仅近约 7 天私聊；发送仅支持文本。非即时推送。
  </footer>
  <script>
    const LS_KEY = "wecom_dm_ui_v1";
    let selfUserid = "";
    let currentUserid = null;
    let stickBottom = true;
    let lastConvPayload = null;
    let lastMsgPayload = null;

    const sidebar = document.getElementById("sidebar");
    const msgsEl = document.getElementById("msgs");
    const chatHead = document.getElementById("chatHead");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const syncMeta = document.getElementById("syncMeta");
    const syncErr = document.getElementById("syncErr");

    msgsEl.addEventListener("scroll", () => {
      const gap = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight;
      stickBottom = gap < 40;
    });

    function loadSnap() {
      try { return JSON.parse(localStorage.getItem(LS_KEY) || "null"); }
      catch { return null; }
    }

    function saveSnap() {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify({
          selfUserid,
          currentUserid,
          conversations: lastConvPayload,
          messages: lastMsgPayload,
        }));
      } catch {}
    }

    async function api(path, opts) {
      const r = await fetch(path, opts);
      return r.json();
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function renderBody(m) {
      const mt = m.msgtype;
      if (mt === "text") return esc(m.text && m.text.content);
      const obj = m[mt] || {};
      const file = obj.local_file;
      if (mt === "image" && file) {
        return `<img src="/media/${encodeURIComponent(file)}" alt="image" />`;
      }
      if (mt === "voice" && file) {
        return `<audio controls preload="metadata" src="/media/${encodeURIComponent(file)}"></audio>`;
      }
      if (mt === "video" && file) {
        return `<video controls preload="metadata" playsinline src="/media/${encodeURIComponent(file)}"></video>`;
      }
      if (file) {
        return `<a href="/media/${encodeURIComponent(file)}" target="_blank" rel="noopener">[${esc(mt)}] 下载</a>`;
      }
      return `[${esc(mt)}]`;
    }

    function renderList(data, { fromCache } = {}) {
      if (!data) return;
      // don't wipe a good list with an empty transient response
      if (!fromCache && lastConvPayload && !(data.conversations || []).length
          && (lastConvPayload.conversations || []).length) {
        syncMeta.textContent = (data.last_sync ? `上次同步 ${data.last_sync}` : syncMeta.textContent)
          + " · 刷新中…";
        return;
      }
      lastConvPayload = data;
      selfUserid = data.self_userid || selfUserid;
      syncMeta.textContent = data.last_sync
        ? `上次同步 ${data.last_sync}${fromCache ? " · 本地缓存" : ""}`
        : (fromCache ? "本地缓存" : "等待首次同步…");
      syncErr.textContent = data.error || "";
      const list = data.conversations || [];
      sidebar.innerHTML = list.map(c => {
        const active = c.userid === currentUserid ? " active" : "";
        const empty = c.has_messages ? "" : " empty";
        return `<div class="conv${active}${empty}" data-userid="${esc(c.userid)}">
          <div class="name">${esc(c.name)}</div>
          <div class="preview">${esc(c.last_preview || (c.has_messages ? "" : "暂无近 7 天消息"))}</div>
          <div class="time">${esc(c.last_time || "")}</div>
        </div>`;
      }).join("") || `<div class="empty-state" style="padding:1rem">暂无联系人</div>`;

      sidebar.querySelectorAll(".conv").forEach(el => {
        el.addEventListener("click", () => selectUser(el.dataset.userid));
      });
      saveSnap();
    }

    function renderMessages(data, { fromCache } = {}) {
      if (!data) return;
      if (!fromCache && lastMsgPayload && data.userid === lastMsgPayload.userid
          && !(data.messages || []).length && (lastMsgPayload.messages || []).length) {
        return;
      }
      lastMsgPayload = data;
      const users = data.users || {};
      const list = data.messages || [];
      chatHead.innerHTML = `${esc(data.name || data.userid)}
        <div class="sub">${esc(data.userid)}</div>`;
      input.disabled = false;
      sendBtn.disabled = false;
      if (!list.length) {
        msgsEl.innerHTML = `<div class="empty-state">近 7 天暂无消息，可直接发送</div>`;
        saveSnap();
        return;
      }
      msgsEl.innerHTML = list.map(m => {
        const mine = m.userid === (data.self_userid || selfUserid);
        return `<div class="bubble-row ${mine ? "mine" : ""}">
          <div class="bubble ${mine ? "mine" : "theirs"}">
            ${renderBody(m)}
            <div class="when">${esc(m.send_time || "")}${mine ? "" : " · " + esc(users[m.userid] || m.userid || "")}</div>
          </div>
        </div>`;
      }).join("");
      if (stickBottom) msgsEl.scrollTop = msgsEl.scrollHeight;
      saveSnap();
    }

    async function selectUser(userid, { skipFetch } = {}) {
      currentUserid = userid;
      input.disabled = false;
      sendBtn.disabled = false;
      stickBottom = true;
      sidebar.querySelectorAll(".conv").forEach(el => {
        el.classList.toggle("active", el.dataset.userid === userid);
      });
      saveSnap();
      if (skipFetch) return;
      const data = await api("/api/messages?userid=" + encodeURIComponent(userid));
      renderMessages(data);
    }

    async function refresh() {
      const data = await api("/api/conversations");
      renderList(data);
      if (currentUserid) {
        const msgs = await api("/api/messages?userid=" + encodeURIComponent(currentUserid));
        renderMessages(msgs);
      }
    }

    document.getElementById("composer").addEventListener("submit", async (e) => {
      e.preventDefault();
      const content = input.value.trim();
      if (!currentUserid || !content) return;
      sendBtn.disabled = true;
      const prev = input.value;
      input.value = "";
      try {
        const res = await api("/api/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userid: currentUserid, content }),
        });
        if (!res.ok) {
          input.value = prev;
          alert(res.error || "发送失败");
        } else {
          stickBottom = true;
          // paint from send response; avoid immediate full refresh racing API lag
          if (res.message) {
            if (!lastMsgPayload || lastMsgPayload.userid !== currentUserid) {
              lastMsgPayload = {
                userid: currentUserid,
                name: (lastConvPayload && (lastConvPayload.conversations || [])
                  .find(c => c.userid === currentUserid) || {}).name || currentUserid,
                messages: [],
                self_userid: selfUserid,
                users: {},
              };
            }
            lastMsgPayload.messages = [...(lastMsgPayload.messages || []), res.message];
            renderMessages(lastMsgPayload);
          }
          if (lastConvPayload) {
            const hit = (lastConvPayload.conversations || []).find(c => c.userid === currentUserid);
            if (hit) {
              hit.last_preview = content;
              hit.last_time = (res.message && res.message.send_time) || hit.last_time;
              hit.has_messages = true;
              // move to top among has_messages
              lastConvPayload.conversations = [
                hit,
                ...(lastConvPayload.conversations || []).filter(c => c.userid !== currentUserid),
              ];
              renderList(lastConvPayload);
            }
          }
          setTimeout(refresh, 2500);
        }
      } catch (err) {
        input.value = prev;
        alert(String(err));
      } finally {
        sendBtn.disabled = !currentUserid;
        input.focus();
      }
    });

    // instant paint from browser cache, then revalidate
    const snap = loadSnap();
    if (snap) {
      selfUserid = snap.selfUserid || "";
      currentUserid = snap.currentUserid || null;
      if (snap.conversations) renderList(snap.conversations, { fromCache: true });
      if (snap.messages && snap.currentUserid && snap.messages.userid === snap.currentUserid) {
        renderMessages(snap.messages, { fromCache: true });
      }
    }
    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
